<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour & Travel Lists</title>
    <link rel="stylesheet" href="../src/output.css" />
    <script src="our-tour.js"></script>
</head>
<body>
<header
      class="fixed top-0 z-50 w-full backdrop-blur-md bg-slate-950/80 border-b border-white/10 transition-all duration-300"
      id="navbar"
    >
      <div class="flex items-center justify-between px-4 md:px-8 py-4">
        <!-- Logo - Link to Home -->
        <a
          href="../index.html"
          class="text-2xl md:text-3xl font-black text-amber-400 transition-transform duration-300 hover:scale-105"
          id="nY-logo"
          >Drimora</a
        >

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-1 lg:gap-2">
          <a
            href="../index.html#home"
            class="px-3 py-2 text-white font-semibold text-sm lg:text-base hover:text-amber-400 transition-colors duration-300"
            >Home</a
          >
          <a
            href="../index.html#tours"
            class="px-3 py-2 text-white font-semibold text-sm lg:text-base hover:text-amber-400 transition-colors duration-300"
            >Tours</a
          >
          <a
            href="#places"
            class="px-3 py-2 text-white font-semibold text-sm lg:text-base hover:text-amber-400 transition-colors duration-300"
            >Places</a
          >
          <a
            href="#attractions"
            class="px-3 py-2 text-white font-semibold text-sm lg:text-base hover:text-amber-400 transition-colors duration-300"
            >Attractions</a
          >
          <a
            href="../index.html#booking"
            class="px-3 py-2 text-white font-semibold text-sm lg:text-base hover:text-amber-400 transition-colors duration-300"
            >Book</a
          >
          <a
            href="../index.html#contact"
            class="px-3 py-2 text-white font-semibold text-sm lg:text-base hover:text-amber-400 transition-colors duration-300"
            >Contact</a
          >
          <button
            onclick="logout()"
            class="ml-4 px-4 py-2 bg-linear-to-r from-amber-400/20 to-orange-500/20 hover:from-amber-400/30 hover:to-orange-500/30 border border-amber-400/40 text-white font-semibold rounded-lg transition-all duration-300"
          >
            Logout
          </button>
        </nav>

        <!-- Mobile Hamburger -->
        <button
          id="hamburger-ny"
          class="md:hidden flex flex-col gap-1.5 w-8 h-8 justify-center cursor-pointer bg-transparent border-none p-0 focus:outline-none"
        >
          <span
            class="w-6 h-0.5 bg-white rounded-full transition-all duration-300"
          ></span>
          <span
            class="w-6 h-0.5 bg-white rounded-full transition-all duration-300"
          ></span>
          <span
            class="w-6 h-0.5 bg-white rounded-full transition-all duration-300"
          ></span>
        </button>
      </div>

      <!-- Mobile Menu -->
      <nav
        id="navMenu-ny"
        class="hidden md:hidden absolute top-full left-0 right-0 bg-slate-950/95 backdrop-blur-lg border-b border-white/10 flex flex-col gap-1 py-4 px-4 animate-slide-down"
      >
        <a
          href="../index.html#home"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Home</a
        >
        <a
          href="../index.html#tours"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Tours</a
        >
        <a
          href="#places"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Places</a
        >
        <a
          href="#attractions"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Attractions</a
        >
        <a
          href="../index.html#booking"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Book</a
        >
        <a
          href="../index.html#contact"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Contact</a
        >
        <a
          href="#gallery"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Gallery</a
        >
        <a
          href="#reviews"
          class="px-4 py-3 text-white font-semibold hover:text-amber-400 hover:bg-white/5 rounded-lg transition-all duration-300"
          >Reviews</a
        >
        <button
          onclick="logout()"
          class="mt-2 px-4 py-3 bg-linear-to-r from-amber-400/20 to-orange-500/20 border border-amber-400/40 text-white font-semibold rounded-lg hover:from-amber-400/30 hover:to-orange-500/30 transition-all duration-300 w-full"
        >
          Logout
        </button>
      </nav>
    </header>

</body>
</html>
