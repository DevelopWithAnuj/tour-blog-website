<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Details | Drimora Booking</title>
    <link rel="stylesheet" href="../src/output.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../components/sidebar.js"></script>
    <script src="../components/header.js"></script>
    <style>
      .dest-card input:checked + .dest-card-body {
        border-color: rgb(251 191 36);
        box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.35);
      }
      .dest-card input:checked + .dest-card-body .dest-check {
        opacity: 1;
        transform: scale(1);
      }
      .pkg-card input:checked + .pkg-card-body {
        border-color: rgb(251 191 36);
        background-color: rgba(251, 191, 36, 0.08);
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        display: block;
        cursor: pointer;
        filter: invert(0.8); /* Adjust icon color for dark mode UI */
        padding: 4px;
      }

      /* Optional: Make the entire input clickable */
      input[type="date"] {
        position: relative;
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
    <site-sidebar
      active="book"
      home-href="../index.html"
      tours-href="../Our-Tour/our-tour.html"
      book-href="./booking.html"
    ></site-sidebar>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="md:pl-60 pt-16 md:pt-0 min-h-screen">
      <site-header
        title="Booking"
        subtitle="Tour & Travel Booking Page"
        search="true"
      ></site-header>

      <div class="mx-auto max-w-5xl px-4 py-10 md:px-10 md:py-14">
        <!-- Stepper -->
        <div class="mb-10 flex items-center justify-center gap-2 md:gap-4">
          <div class="flex items-center gap-2">
            <span
              class="flex h-8 w-8 items-center justify-center rounded-full bg-amber-400 text-sm font-black text-slate-950"
              >1</span
            >
            <span class="hidden text-sm font-bold text-amber-400 sm:inline"
              >Trip Details</span
            >
          </div>
          <span class="h-px w-8 bg-white/15 md:w-16"></span>
          <div class="flex items-center gap-2 opacity-50">
            <span
              class="flex h-8 w-8 items-center justify-center rounded-full border border-white/20 text-sm font-black text-white/60"
              >2</span
            >
            <span class="hidden text-sm font-bold text-white/60 sm:inline"
              >Payment</span
            >
          </div>
          <span class="h-px w-8 bg-white/15 md:w-16"></span>
          <div class="flex items-center gap-2 opacity-50">
            <span
              class="flex h-8 w-8 items-center justify-center rounded-full border border-white/20 text-sm font-black text-white/60"
              >3</span
            >
            <span class="hidden text-sm font-bold text-white/60 sm:inline"
              >Confirmation</span
            >
          </div>
        </div>

        <div class="mb-8 text-center">
          <h1 class="text-3xl font-black md:text-4xl">Plan Your Trip</h1>
          <p class="mt-2 text-sm text-white/60 md:text-base">
            Tell us where you're headed and who's coming along.
          </p>
        </div>

        <form id="tripForm" class="space-y-8">
          <!-- Destination -->
          <div class="rounded-2xl border border-white/10 bg-white/5 p-5 md:p-7">
            <h2 class="flex items-center gap-2 text-base font-black text-white">
              <i data-lucide="map-pin" class="h-4 w-4 text-amber-400"></i>Choose
              your destination
            </h2>
            <div class="mt-4 grid gap-4 sm:grid-cols-3">
              <label class="dest-card block cursor-pointer">
                <input
                  type="radio"
                  name="destination"
                  value="new-york"
                  class="peer sr-only"
                  data-name="New York"
                  data-price="3200"
                  data-img="./assests/ny-bg.avif"
                />
                <span
                  class="dest-card-body block overflow-hidden rounded-xl border-2 border-white/10 bg-slate-900 transition"
                >
                  <span class="relative block">
                    <img
                      src="../assests/nY-gallery/images15.jfif"
                      alt="New York"
                      class="h-28 w-full object-cover"
                    />
                    <span
                      class="dest-check absolute right-2 top-2 flex h-6 w-6 scale-75 items-center justify-center rounded-full bg-amber-400 text-slate-950 opacity-0 transition"
                    >
                      <i data-lucide="check" class="h-3.5 w-3.5"></i>
                    </span>
                  </span>
                  <span class="block p-3">
                    <span class="block text-sm font-black text-white"
                      >New York</span
                    >
                    <span class="block text-xs font-semibold text-white/50"
                      >From $3,200</span
                    >
                  </span>
                </span>
              </label>

              <label class="dest-card block cursor-pointer">
                <input
                  type="radio"
                  name="destination"
                  value="norway"
                  class="peer sr-only"
                  data-name="Norway"
                  data-price="4600"
                  data-img="./assests/norc-bg.avif"
                />
                <span
                  class="dest-card-body block overflow-hidden rounded-xl border-2 border-white/10 bg-slate-900 transition"
                >
                  <span class="relative block">
                    <img
                      src="../assests/norc-bg.avif"
                      alt="Norway"
                      class="h-28 w-full object-cover"
                    />
                    <span
                      class="dest-check absolute right-2 top-2 flex h-6 w-6 scale-75 items-center justify-center rounded-full bg-amber-400 text-slate-950 opacity-0 transition"
                    >
                      <i data-lucide="check" class="h-3.5 w-3.5"></i>
                    </span>
                  </span>
                  <span class="block p-3">
                    <span class="block text-sm font-black text-white"
                      >Norway</span
                    >
                    <span class="block text-xs font-semibold text-white/50"
                      >From $4,600</span
                    >
                  </span>
                </span>
              </label>

              <label class="dest-card block cursor-pointer">
                <input
                  type="radio"
                  name="destination"
                  value="uae"
                  class="peer sr-only"
                  data-name="United Arab"
                  data-price="5400"
                  data-img="./assests/ua-bg.avif"
                />
                <span
                  class="dest-card-body block overflow-hidden rounded-xl border-2 border-white/10 bg-slate-900 transition"
                >
                  <span class="relative block">
                    <img
                      src="../assests/ua-bg.avif"
                      alt="United Arab"
                      class="h-28 w-full object-cover"
                    />
                    <span
                      class="dest-check absolute right-2 top-2 flex h-6 w-6 scale-75 items-center justify-center rounded-full bg-amber-400 text-slate-950 opacity-0 transition"
                    >
                      <i data-lucide="check" class="h-3.5 w-3.5"></i>
                    </span>
                  </span>
                  <span class="block p-3">
                    <span class="block text-sm font-black text-white"
                      >United Arab</span
                    >
                    <span class="block text-xs font-semibold text-white/50"
                      >From $5,400</span
                    >
                  </span>
                </span>
              </label>
            </div>
          </div>

          <!-- Dates & travelers -->
          <div class="rounded-2xl border border-white/10 bg-white/5 p-5 md:p-7">
            <h2 class="flex items-center gap-2 text-base font-black text-white">
              <i data-lucide="calendar-range" class="h-4 w-4 text-amber-400"></i
              >Dates &amp; travelers
            </h2>
            <div class="mt-4 grid gap-4 sm:grid-cols-2">
              <label class="block">
                <span
                  class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-white/50"
                  >Check-in</span
                >
                <input
                  id="checkin"
                  type="date"
                  required
                  class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30"
                />
              </label>
              <label class="block">
                <span
                  class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-white/50"
                  >Check-out</span
                >
                <input
                  id="checkout"
                  type="date"
                  required
                  class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30"
                />
              </label>
            </div>

            <div class="mt-4 grid gap-4 sm:grid-cols-2">
              <div
                class="flex items-center justify-between rounded-lg border border-white/10 bg-slate-900 px-4 py-3"
              >
                <span
                  class="flex items-center gap-2 text-sm font-bold text-white/80"
                  ><i data-lucide="user" class="h-4 w-4 text-white/50"></i
                  >Adults</span
                >
                <div class="flex items-center gap-3">
                  <button
                    type="button"
                    data-counter="adults"
                    data-step="-1"
                    class="flex h-8 w-8 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white/70 transition hover:border-amber-400 hover:text-amber-400"
                  >
                    &minus;
                  </button>
                  <span
                    id="adultsCount"
                    class="w-4 text-center text-sm font-black text-white"
                    >1</span
                  >
                  <button
                    type="button"
                    data-counter="adults"
                    data-step="1"
                    class="flex h-8 w-8 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white/70 transition hover:border-amber-400 hover:text-amber-400"
                  >
                    +
                  </button>
                </div>
              </div>
              <div
                class="flex items-center justify-between rounded-lg border border-white/10 bg-slate-900 px-4 py-3"
              >
                <span
                  class="flex items-center gap-2 text-sm font-bold text-white/80"
                  ><i data-lucide="users" class="h-4 w-4 text-white/50"></i
                  >Children</span
                >
                <div class="flex items-center gap-3">
                  <button
                    type="button"
                    data-counter="children"
                    data-step="-1"
                    class="flex h-8 w-8 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white/70 transition hover:border-amber-400 hover:text-amber-400"
                  >
                    &minus;
                  </button>
                  <span
                    id="childrenCount"
                    class="w-4 text-center text-sm font-black text-white"
                    >0</span
                  >
                  <button
                    type="button"
                    data-counter="children"
                    data-step="1"
                    class="flex h-8 w-8 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white/70 transition hover:border-amber-400 hover:text-amber-400"
                  >
                    +
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Package tier -->
          <div class="rounded-2xl border border-white/10 bg-white/5 p-5 md:p-7">
            <h2 class="flex items-center gap-2 text-base font-black text-white">
              <i data-lucide="sparkles" class="h-4 w-4 text-amber-400"></i
              >Choose your package
            </h2>
            <div class="mt-4 grid gap-3 sm:grid-cols-3">
              <label class="pkg-card block cursor-pointer">
                <input
                  type="radio"
                  name="package"
                  value="standard"
                  data-multiplier="1"
                  class="peer sr-only"
                  checked
                />
                <span
                  class="pkg-card-body block rounded-xl border-2 border-white/10 bg-slate-900 p-4 text-center transition"
                >
                  <span class="block text-sm font-black text-white"
                    >Standard</span
                  >
                  <span class="mt-1 block text-xs font-semibold text-white/50"
                    >Base pricing</span
                  >
                </span>
              </label>
              <label class="pkg-card block cursor-pointer">
                <input
                  type="radio"
                  name="package"
                  value="premium"
                  data-multiplier="1.35"
                  class="peer sr-only"
                />
                <span
                  class="pkg-card-body block rounded-xl border-2 border-white/10 bg-slate-900 p-4 text-center transition"
                >
                  <span class="block text-sm font-black text-white"
                    >Premium</span
                  >
                  <span class="mt-1 block text-xs font-semibold text-white/50"
                    >+35% upgraded stays</span
                  >
                </span>
              </label>
              <label class="pkg-card block cursor-pointer">
                <input
                  type="radio"
                  name="package"
                  value="luxury"
                  data-multiplier="1.75"
                  class="peer sr-only"
                />
                <span
                  class="pkg-card-body block rounded-xl border-2 border-white/10 bg-slate-900 p-4 text-center transition"
                >
                  <span class="block text-sm font-black text-white"
                    >Luxury</span
                  >
                  <span class="mt-1 block text-xs font-semibold text-white/50"
                    >+75% signature service</span
                  >
                </span>
              </label>
            </div>
          </div>

          <!-- Contact -->
          <div class="rounded-2xl border border-white/10 bg-white/5 p-5 md:p-7">
            <h2 class="flex items-center gap-2 text-base font-black text-white">
              <i data-lucide="id-card" class="h-4 w-4 text-amber-400"></i>Your
              details
            </h2>
            <div class="mt-4 grid gap-4 sm:grid-cols-2">
              <label class="block sm:col-span-2">
                <span
                  class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-white/50"
                  >Full name</span
                >
                <input
                  id="fullname"
                  type="text"
                  placeholder="Jordan Taylor"
                  required
                  class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30"
                />
              </label>
              <label class="block">
                <span
                  class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-white/50"
                  >Email address</span
                >
                <input
                  id="email"
                  type="email"
                  placeholder="you@example.com"
                  required
                  class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30"
                />
              </label>
              <label class="block">
                <span
                  class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-white/50"
                  >Phone number</span
                >
                <input
                  id="phone"
                  type="tel"
                  placeholder="+1 555 000 0000"
                  required
                  class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30"
                />
              </label>
              <label class="block sm:col-span-2">
                <span
                  class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-white/50"
                  >Special requests (optional)</span
                >
                <textarea
                  id="requests"
                  rows="3"
                  placeholder="Dietary needs, accessibility, anniversary trip, etc."
                  class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30"
                ></textarea>
              </label>
            </div>
          </div>

          <p
            id="formError"
            class="hidden flex items-center gap-2 rounded-lg border border-rose-400/30 bg-rose-400/10 p-3 text-sm font-semibold text-rose-300"
          >
            <i data-lucide="alert-circle" class="h-4 w-4 shrink-0"></i>
            Please select a destination and a check-out date after check-in.
          </p>

          <div
            class="flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-5"
          >
            <div>
              <p
                class="text-xs font-bold uppercase tracking-wide text-white/50"
              >
                Estimated total
              </p>
              <p id="livePrice" class="text-2xl font-black text-amber-400">
                $0
              </p>
            </div>
            <button
              type="submit"
              class="inline-flex items-center gap-2 rounded-lg bg-amber-400 px-6 py-3.5 text-sm font-bold text-slate-950 transition hover:bg-amber-300"
            >
              Continue to Payment
              <i data-lucide="arrow-right" class="h-4 w-4"></i>
            </button>
          </div>
        </form>
      </div>
    </main>

    <script>
      (function () {
        var destInputs = Array.prototype.slice.call(
          document.querySelectorAll('input[name="destination"]'),
        );
        var pkgInputs = Array.prototype.slice.call(
          document.querySelectorAll('input[name="package"]'),
        );
        var adultsEl = document.getElementById("adultsCount");
        var childrenEl = document.getElementById("childrenCount");
        var checkin = document.getElementById("checkin");
        var checkout = document.getElementById("checkout");
        var livePrice = document.getElementById("livePrice");
        var state = { adults: 1, children: 0 };

        function selectedDestination() {
          return (
            destInputs.find(function (i) {
              return i.checked;
            }) || null
          );
        }
        function selectedPackage() {
          return (
            pkgInputs.find(function (i) {
              return i.checked;
            }) || pkgInputs[0]
          );
        }
        function computeTotal() {
          var dest = selectedDestination();
          var pkg = selectedPackage();
          var base = dest ? parseFloat(dest.dataset.price) : 0;
          var multiplier = parseFloat(pkg.dataset.multiplier || "1");
          var travelerUnits = state.adults + state.children * 0.5;
          return Math.round(base * multiplier * travelerUnits);
        }
        function updatePrice() {
          livePrice.textContent = "$" + computeTotal().toLocaleString();
        }

        destInputs.forEach(function (i) {
          i.addEventListener("change", updatePrice);
        });
        pkgInputs.forEach(function (i) {
          i.addEventListener("change", updatePrice);
        });
        checkin.addEventListener("change", updatePrice);
        checkout.addEventListener("change", updatePrice);

        document.querySelectorAll("[data-counter]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var key = btn.dataset.counter;
            var step = parseInt(btn.dataset.step, 10);
            var min = key === "adults" ? 1 : 0;
            state[key] = Math.max(min, state[key] + step);
            (key === "adults" ? adultsEl : childrenEl).textContent = state[key];
            updatePrice();
          });
        });

        // Pre-select destination from ?tour= query param
        var params = new URLSearchParams(window.location.search);
        var tourParam = params.get("tour");
        if (tourParam) {
          var match = destInputs.find(function (i) {
            return i.value === tourParam;
          });
          if (match) match.checked = true;
        }
        updatePrice();

        var form = document.getElementById("tripForm");
        var formError = document.getElementById("formError");

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var dest = selectedDestination();
          var pkg = selectedPackage();
          var validDates =
            checkin.value &&
            checkout.value &&
            new Date(checkout.value) > new Date(checkin.value);

          if (!dest || !validDates) {
            formError.classList.remove("hidden");
            formError.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }
          formError.classList.add("hidden");

          var booking = {
            destination: {
              id: dest.value,
              name: dest.dataset.name,
              img: dest.dataset.img,
              basePrice: parseFloat(dest.dataset.price),
            },
            checkin: checkin.value,
            checkout: checkout.value,
            adults: state.adults,
            children: state.children,
            package: {
              id: pkg.value,
              multiplier: parseFloat(pkg.dataset.multiplier),
            },
            traveler: {
              fullname: document.getElementById("fullname").value,
              email: document.getElementById("email").value,
              phone: document.getElementById("phone").value,
              requests: document.getElementById("requests").value,
            },
            total: computeTotal(),
            paid: false,
          };

          localStorage.setItem("drimoraBooking", JSON.stringify(booking));
          window.location.href = "payment.html";
        });
      })();

      lucide.createIcons();
    </script>
  </body>
</html>
