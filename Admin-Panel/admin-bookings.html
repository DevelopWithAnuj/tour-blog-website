<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Bookings | Drimora</title>
  <link rel="stylesheet" href="../src/output.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../components/sidebar.js"></script>
</head>
<body class="md:pl-60 pt-16 md:pt-0">

<site-sidebar
  home-href="../index.html"
  tours-href="../Our-Tour/our-tour.html"
  book-href="../Booking-Panel/booking.html"
  sections="Admin Dashboard:./admin-dashboard.html|Add Blog:./admin.html|Bookings:./admin-bookings.html"
></site-sidebar>

<section class="admin-container">
  <h2>📋 Booking Dashboard</h2>

  <table class="admin-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Destination</th>
        <th>Check In</th>
        <th>Check Out</th>
        <th>Travelers</th>
        <th>Status</th>
        <th>Booked At</th>
      </tr>
    </thead>
    <tbody id="bookingTable"></tbody>
  </table>
</section>

<script src="admin-bookings.js"></script>
<script>
  // ========================================
  // HAMBURGER MENU TOGGLE
  // ========================================
  function setupHamburgerMenu() {
    const hamburger = document.getElementById("hamburger");
    const navMenu = document.getElementById("navMenu");

    if (!hamburger || !navMenu) return;

    hamburger.addEventListener("click", function () {
      hamburger.classList.toggle("active");
      navMenu.classList.toggle("active");
    });

    // Close menu when a link is clicked
    const navLinks = navMenu.querySelectorAll("a");
    navLinks.forEach((link) => {
      link.addEventListener("click", function () {
        hamburger.classList.remove("active");
        navMenu.classList.remove("active");
      });
    });

    // Close menu when logout button is clicked
    const logoutBtn = navMenu.querySelector("button");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", function () {
        hamburger.classList.remove("active");
        navMenu.classList.remove("active");
      });
    }
  }

  window.addEventListener("load", setupHamburgerMenu);
</script>
</body>
</html>
