<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Drimora</title>
    <link rel="stylesheet" href="../src/output.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../components/sidebar.js"></script>
  </head>

  <body class="md:pl-60 pt-16 md:pt-0">
    <site-sidebar
      active=""
      home-href="../index.html"
      tours-href="../Our-Tour/our-tour.html"
      book-href="../Booking-Panel/booking.html"
      sections="Blogs:../index.html#blogs"
    ></site-sidebar>
    <!-- Page loader -->
    <div id="pageLoader">
      <div class="page-spinner"></div>
    </div>

    <!-- Blog Details -->
    <section class="blog-detail-container">
      <div id="blogDetails" class="blog-detail-card"></div>
    </section>

    <!-- Comments -->
    <section class="comment-section">
      <h3>💬 Comments</h3>

      <div id="comments" class="comment-list"></div>

      <div class="comment-box">
        <input id="commentInput" placeholder="Share your thoughts..." />
        <button onclick="addComment()" class="comment-btn">Post Comment</button>
      </div>
    </section>

    <script src="blog.js"></script>
    <script>
      // ========================================
      // HAMBURGER MENU TOGGLE
      // ========================================
      function setupHamburgerMenu() {
        const hamburger = document.getElementById("hamburger");
        const navMenu = document.getElementById("navMenu");

        if (!hamburger || !navMenu) return;

        hamburger.addEventListener("click", function () {
          hamburger.classList.toggle("active");
          navMenu.classList.toggle("active");
        });

        // Close menu when a link is clicked
        const navLinks = navMenu.querySelectorAll("a");
        navLinks.forEach((link) => {
          link.addEventListener("click", function () {
            hamburger.classList.remove("active");
            navMenu.classList.remove("active");
          });
        });

        // Close menu when logout button is clicked
        const logoutBtn = navMenu.querySelector("button");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", function () {
            hamburger.classList.remove("active");
            navMenu.classList.remove("active");
          });
        }
      }

      window.addEventListener("load", setupHamburgerMenu);
    </script>
  </body>
</html>
