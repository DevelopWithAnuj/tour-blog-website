<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Drimora</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
  <h1 class="logo">Drimora</h1>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="admin.html">Add Blog</a>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </nav>
</header>


<div class="admin-container">
  <h2>📊 Blog Management</h2>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Image</th>
        <th>Content Preview</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="blogTable"></tbody>
  </table>
</div>
<div id="editModal" class="modal hidden">
  <div class="modal-box">
    <h3>Edit Blog</h3>

    <input id="editTitle">
    <textarea id="editContent"></textarea>
    <input type="file" id="editImage">

    <button onclick="updateBlog()">Update</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>
  </div>
</div>

<!-- Footer -->
    <footer>
      <div class="footer-inner">
        <div class="footer-brand">Drimora</div>
        <div class="footer-links">
          <a href="#">Company</a>
          <a href="#contact">Contact</a>
          <a href="#">Privacy</a>
        </div>
        <div class="footer-social">Follow us</div>
      </div>
    </footer>

<script src="admin-dashboard.js"></script>
</body>
</html>
